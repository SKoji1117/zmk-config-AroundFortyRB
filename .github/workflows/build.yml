# ビルド結果に関わるファイルが変わったときだけ走らせる（README や画像だけの変更では走らない）
on:
  push:
    paths:
      - "config/**"
      - "build.yaml"
      - "zephyr/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "config/**"
      - "build.yaml"
      - "zephyr/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build:
    # Last successful workflow (2026-02-17); compatible with ZMK v0.2 / Zephyr 3.5.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@39a14154a98479b864fba7735717e5147f6c0c14
